services:
  - type: web
    name: baoyan-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --threads 4
    envVars:
      - key: LLM_API_BASE
        value: https://api.llm.ustc.edu.cn/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: glm-5.2
