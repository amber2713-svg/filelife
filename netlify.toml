[build]
  command = "pip install -r requirements.txt -t netlify/functions/vendor"
  publish = "static"

[functions]
  directory = "netlify/functions"
  python_runtime = "python3.11"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
