[build]
  command = "echo 'No build step needed'"
  publish = "static"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["httpx"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
